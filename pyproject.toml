[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minsky"
version = "0.1.0"
description = "Intent-driven, outcome-based feature design via a hierarchical society of specialist agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]
llm = [
    "anthropic>=0.40",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
local-llm = [
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minsky = ["data/*.json"]

[tool.ruff]
line-length = 100
